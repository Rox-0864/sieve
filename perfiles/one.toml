    "desarrollador", "desarrolladora", "dev", "devs jr", "jr",
    # El marco con el que Alura presenta el programa entero:
    # "Conoce las Historias de ONE", "historias de quienes
    # transformaron sus vidas".
    "historias", "transformacion", "historia",
    # "habilidades tecnicas y conductuales" es como Oracle describe lo
