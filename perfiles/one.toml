# ── LO QUE ONE NO PUEDE DECIR, o todavia no dijo ──────────────────────
# Lista de prohibiciones y huecos. Un sistema honesto declara lo que no
# sabe. Un motor con supuestos silenciosos es un motor que miente.
#
# Antes de la investigacion web esta lista tinha SEIS huecos. La web
# contesto cuatro. Los que quedan son distintos en naturaleza: ya no
# son "que significa esta palabra" sino "que autorizo a decir sobre
# una persona", y eso no lo contesta ningun sitio publico.

[restricciones]
