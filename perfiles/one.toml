    "habilidades", "tecnicas", "conductuales",
    # Los miembros dicen "culminar" y "concluir", nunca "egresar". Es
    # el registro real de la comunidad y el que hay que imitar.
    "culminar", "culmino", "concluir", "concluyo",
]

# ── SIGLAS Y EXPANSIONES ─────────────────────────────────────────────
# "OCI" y "Oracle Cloud Infrastructure" son lo mismo escrito distinto.
# Sin este mapa, el check de entidades rechazaria el ejemplo oficial del
# propio brief de ONE, que seria un absurdo.

[expansiones]
"oracle cloud infrastructure" = "oci"
"oracle cloud" = "oci"
"infraestructura oracle cloud" = "oci"
"oraclecloud" = "oci"
"inteligencia artificial" = "ia"
"inteligenciaartificial" = "ia"
