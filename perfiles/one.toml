# "Dev Jr" y "Desarrolladora Junior" son la misma persona con el mismo
# puesto, no un dato nuevo.
#
# El comentario de arriba prometia algo que los datos NO cumplian:
# "dev" estaba mapeado a "dev", que es una identidad y no_respalda nada
# -- el check busca la forma larga en la fuente, y "dev" no esta en
# "puesto de Desarrolladora Junior". Con eso, el ejemplo OFICIAL del
# propio brief ("Dev Jr de IA" contra una fuente que dice "Desarrolladora
# Junior de IA") salia rechazado por entidades. Un mapa de abreviaturas
# cuya entrada no abrevia a nada es un mapa que no esta probando nada.
#
# LIMITACION CONOCIDA, y no de este archivo: la forma larga es una sola,
# asi que "dev" abrevia a "desarrolladora" y no a "desarrollador". Con
# una fuente masculina el check la va a rechazar, y va a tener razon:
# no hay forma de saber que "Dev" y "Desarrollador" son el mismo puesto
# sin el documento. Que ONE lo confirme es un `[PENDIENTE]`.
[abreviaturas]
"jr" = "junior"
"jrta" = "junior"
"sr" = "senior"
"srta" = "seniorita"
"dev" = "desarrolladora"
"srjr" = "senior"
"tec" = "tecnologico"
"org" = "organizacion"

# ── SUPUESTOS DECLARADOS ─────────────────────────────────────────────
# Palabras de contexto institucional que se usan SIN respaldo textual y
# que el check reporta como `aprobado_con_supuestos` en vez de
# rechazarlas. Son encuadre declarado, no informacion.
#
# IMPORTANTE — aca se corrige un error que estaba en el codigo.
# Antes decia, textual: "los miembros de la comunidad son estudiantes
# del programa". Es FALSO en el propio documento de ONE: el ejemplo
# tiene a Mariana, que si dice "el proyecto del curso", y a Lucas, que
# pregunta por LangGraph y no dice en ningun lado que sea estudiante.
# Un supuesto global sobre "los miembros" declara una cosa que el
# documento desmiente. Un supuesto acotado al vocablo, que es lo que
# queda aca, declara solo que la palabra sugiere pertenencia a un
# programa, que es la parte que efectivamente se esta suponiendo.
#
# [PENDIENTE] el documento NO define si ONE es un programa de
# estudiantes, una comunidad de profesionales, o ambas. La palabra
# "estudiante" quedo porque el brief la usa, pero la relacion
# institucional real necesita que ONE la confirme.

[supuestos]
# Estas justificaciones ya NO son mioas: son la documentacion publica
# de Oracle, textual. Antes de la investigacion web estas tres lineas
# decian "el documento no aclara el alcance", y la web SI aclaraba.
# Un supuesto cuya justificacion podemos citar es distinto de uno que
# tenemos que defender en una reunion.

"estudiante" = "terminologia oficial de Oracle: 'Para ser un (a) estudiante ONE es necesario tener mas de 18 anos'. Es como la propia organizacion llama a quien cursa"
"estudiantes" = "terminologia oficial de Oracle, misma fuente. Alura titula su pagina de testimonios 'lo que los estudiantes ONE dicen en las redes'"
"egresad" = "AlumniONE es la comunidad oficial de graduados, y es DISTINTA de la de estudiantes: un alumni fue estudiante y hoy no lo es. Decir 'estudiante' de un alumni seria un error, no un supuesto"
"graduad" = "la pagina de Oracle llama 'graduados' a quienes terminan las rutas obligatorias. Es el mismo estado que alumni"
"participante" = "NO aparece en la documentacion oficial. Oracle dice estudiante, asi que por lo tanto queda como supuesto nuestro y no como terminologia de marca"

