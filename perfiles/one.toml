# ── TOKENS DE VIGILANCIA ──────────────────────────────────────────────
# Esto lo lee la automatizacion, no el redactor. Terminos que un humano
# tiene que ver antes de publicar, porque tocan un borde que el
# documento no resuelve.

[vigilancia]
# La distincion que hace el trabajo NO es legalista: la escribio Oracle.
#
# Lo que Oracle SI dice de si mismo (textual):
#   "programa de educacion y empleabilidad que forma a personas en
#    tecnologia y las conecta con el mercado laboral"
#   "trabaja en la capacitacion de tus habilidades... para que seas un
#    Desarrollador (a) Junior"
#   "tendras acceso a nuestra plataforma de vacantes y podras participar
#    de procesos selectivos en las empresas socias"
#
# Eso autoriza a hablar de MERCADO, de VACANTES y de PROCESOS
# SELECTIVOS. No autoriza a decir que una persona concreta fue
# contratada, porque "procesos selectivos" no es "empleo".
#
# Estos terminos se MARCAN para un humano, no se bloquean: son
# legitimos cuando hablan del programa y problematicos cuando hablan de
# una persona. El codigo no puede distinguir eso, y por eso los
# escalona en un humano.
terminos = [
    "empleo", "empleada", "contratada", "contratado", "contrato",
    "salario", "sueldo", "primera oportunidad", "primera vez",
    "garantia", "garantizado", "procesos selectivos", "vacantes",
    "mercado laboral", "empleabilidad",
]
motivo = "la conexion con el mercado laboral es la razon de ser del programa segun Oracle, asi que la palabra es institucional; lo que se vigila es que no se aplique a una persona concreta sin que ella lo haya dicho"
