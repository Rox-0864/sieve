[project]
name = "sieve"
version = "0.1.0"
description = "Turns raw community conversations into publish-ready content."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rosy" }]

# Dependencias minimas del M0. Se agregan por hito, no de una:
# cada dependencia que se instala es una dependencia que hay que
# mantener, auditar y puede romper la instalacion.
dependencies = [
    "pydantic>=2.7",        # el contrato de datos. No negociable.
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# LLM adapters — se instalan solo los que se usan.
llm = [
    "google-generativeai>=0.7",
    "openai>=1.30",
    "anthropic>=0.30",
    "langchain-core>=0.3",
]
# UI del panel de curacion
ui = [
    "streamlit>=1.37",
    "pandas>=2.2",
]
# Persistencia en OCI Object Storage
oci = [
    "oci>=8.0",
]
# Datos reales de comunidades
data = [
    "datasets>=2.20",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
sieve = "sieve.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=sieve --cov-report=term-missing"
filterwarnings = [
    # El campo `copy` de PostLinkedin tapa `BaseModel.copy()`. Se mantiene
    # el nombre porque lo exige el contrato del documento ONE. Es una
    # decision consciente, no un descuido.
    "ignore:Field name \"copy\".*:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH"]
ignore = ["B008"]  # FastAPI dependency-injectionFalse positive

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
